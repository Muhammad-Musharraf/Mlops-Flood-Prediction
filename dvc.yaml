stages:
  data_ingestion:
    cmd: python src/extraction.py
    deps:
      - src/extraction.py
    outs:
      - data/raw/flood_raw.csv
  Preprocessing:
    cmd: python src/preprocessing.py
    deps:
      - src/preprocessing.py
    outs:
      - data/transform
  Training:
    cmd: python src/train.py
    deps:
      - src/train.py
    metrics:
      - artifacts/scores.json:
          cache: false

  Best_model:
    cmd: python src/best_model.py
    deps:
      - src/best_model.py
      - logs/best_run_id.txt        
    outs:
      - models/best_model_latest    
    metrics:
      - logs/best_model.log:
          cache: false   
 
    

  
